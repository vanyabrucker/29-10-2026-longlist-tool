# Local infrastructure for the gateway: Postgres (master database) and an
# S3-compatible object store for the original source files.
# Ports are offset from the defaults so they don't clash with local installs.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
      POSTGRES_DB: helios
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios"]
      interval: 2s
      retries: 30

  # S3-compatible object storage. MinIO no longer publishes community images,
  # so SeaweedFS's S3 gateway stands in locally; any S3 service works in
  # production. No identities configured, so any access key is accepted.
  storage:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    ports:
      - "9010:8333"
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:

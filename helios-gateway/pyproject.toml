[project]
name = "helios-gateway"
version = "0.1.0"
description = "Helios ingestion gateway: imports spreadsheets into the master database and serves it."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "boto3>=1.35",
    "httpx>=0.28",
    "python-calamine>=0.3",
    "openpyxl>=3.1",
    "msoffcrypto-tool>=5.4",
    "rapidfuzz>=3.10",
    "pycountry>=24.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py313"
